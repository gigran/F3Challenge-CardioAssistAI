services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cardioassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardioassist
      POSTGRES_USER: cardioassist
      POSTGRES_PASSWORD: cardioassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: